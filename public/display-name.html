<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>اسم العرض - SpeakOra</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #0f172a;
      color: #fff;
      font-family: Arial, sans-serif;
    }

    .box {
      width: min(90%, 420px);
      padding: 32px;
      text-align: center;
      background: #1e293b;
      border-radius: 20px;
      box-sizing: border-box;
    }

    h1 {
      margin-bottom: 12px;
    }

    p {
      color: #cbd5e1;
      line-height: 1.7;
    }

    input {
      width: 100%;
      box-sizing: border-box;
      padding: 14px;
      margin-top: 15px;
      border: 1px solid #475569;
      border-radius: 12px;
      background: #0f172a;
      color: #fff;
      font-size: 16px;
      outline: none;
    }

    button {
      width: 100%;
      padding: 14px;
      margin-top: 15px;
      border: 0;
      border-radius: 12px;
      cursor: pointer;
      font-size: 16px;
      font-weight: bold;
      background: #fff;
      color: #111827;
    }

    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    #error {
      margin-top: 15px;
      color: #fca5a5;
      line-height: 1.6;
      display: none;
    }
  </style>
</head>

<body>
  <main class="box">
    <h1>اختَر اسم العرض</h1>

    <p>
      أدخل اسم العرض الذي تريد استخدامه في SpeakOra.
      يمكنك استخدام اسمك الحقيقي أو اسم مستعار.
    </p>

    <input
      id="displayName"
      type="text"
      maxlength="50"
      autocomplete="nickname"
      placeholder="اسم العرض"
    >

    <button id="saveBtn" type="button">
      متابعة
    </button>

    <div id="error"></div>
  </main>

  <script type="module">
    import {
      auth,
      getUserProfile,
      saveDisplayName
    } from "./js/auth.js";



    const input = document.getElementById("displayName");
    const button = document.getElementById("saveBtn");
    const errorBox = document.getElementById("error");

    const returnTo =
      new URLSearchParams(window.location.search).get("return") || "/";

    let currentUser = null;

    function showError(message) {
      errorBox.textContent = message;
      errorBox.style.display = "block";
    }

    function hideError() {
      errorBox.textContent = "";
      errorBox.style.display = "none";
    }

    onAuthStateChanged(auth, async (user) => {
      if (!user) {
        window.location.replace(
          "/login.html?return=" +
          encodeURIComponent(returnTo)
        );
        return;
      }

      currentUser = user;

      try {
        const profile = await getUserProfile(user);

        if (profile && profile.displayName) {
          window.location.replace(returnTo);
        }
      } catch (error) {
        console.error(error);
      }
    });

    button.addEventListener("click", async () => {
      hideError();

      if (!currentUser) {
        return;
      }

      const name = input.value.trim();

      if (!name) {
        showError("يرجى إدخال اسم العرض للمتابعة.");
        input.focus();
        return;
      }

      button.disabled = true;
      button.textContent = "جاري الحفظ...";

      try {
        await saveDisplayName(currentUser, name);

        window.location.replace(returnTo);
      } catch (error) {
        console.error(error);

        showError(
          error?.message ||
          "تعذر حفظ اسم العرض. حاول مرة أخرى."
        );

        button.disabled = false;
        button.textContent = "متابعة";
      }
    });
  </script>
</body>
</html>
