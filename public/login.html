<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>تسجيل الدخول - SpeakOra</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #0f172a;
      color: #fff;
      font-family: Arial, sans-serif;
    }

    .box {
      width: min(90%, 420px);
      padding: 32px;
      text-align: center;
      background: #1e293b;
      border-radius: 20px;
      box-sizing: border-box;
    }

    h1 {
      margin-bottom: 12px;
    }

    p {
      color: #cbd5e1;
      line-height: 1.7;
    }

    button {
      width: 100%;
      padding: 14px;
      margin-top: 20px;
      border: 0;
      border-radius: 12px;
      cursor: pointer;
      font-size: 16px;
      font-weight: bold;
    }

    #googleBtn {
      background: #fff;
      color: #111827;
    }

    #error {
      margin-top: 15px;
      color: #fca5a5;
      display: none;
    }
  </style>
</head>

<body>
  <main class="box">
    <h1>تسجيل الدخول إلى SpeakOra</h1>
    <p>سجّل الدخول بحساب Google للمتابعة واستخدام توليد الصوت.</p>

    <button id="googleBtn" type="button">
      متابعة باستخدام Google
    </button>

    <div id="error"></div>
  </main>

  <script type="module">
    import {
      loginWithGoogle,
      getUserProfile,
      auth
    } from "./js/auth.js";



    const button = document.getElementById("googleBtn");
    const errorBox = document.getElementById("error");

    const returnTo =
      new URLSearchParams(window.location.search).get("return") || "/";

    function showError(message) {
      errorBox.textContent = message;
      errorBox.style.display = "block";
    }

    onAuthStateChanged(auth, async (user) => {
      if (!user) return;

      try {
        const profile = await getUserProfile(user);

        if (profile && profile.displayName) {
          window.location.replace(returnTo);
        } else {
          window.location.replace(
            "/display-name.html?return=" +
            encodeURIComponent(returnTo)
          );
        }
      } catch (error) {
        console.error(error);
      }
    });

    button.addEventListener("click", async () => {
      button.disabled = true;
      button.textContent = "جاري تسجيل الدخول...";

      try {
        const user = await loginWithGoogle();
        const profile = await getUserProfile(user);

        if (profile && profile.displayName) {
          window.location.replace(returnTo);
        } else {
          window.location.replace(
            "/display-name.html?return=" +
            encodeURIComponent(returnTo)
          );
        }
      } catch (error) {
        console.error(error);
        showError("تعذر تسجيل الدخول. حاول مرة أخرى.");
        button.disabled = false;
        button.textContent = "متابعة باستخدام Google";
      }
    });
  </script>
</body>
</html>
